server.port=8082

# gRPC server configuration
grpc.server.port=59091

# Kafka configuration
kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=ru.yandex.practicum.kafka.serializer.GeneralAvroSerializer

# Kafka topics
kafka.topic.sensors=telemetry.sensors.v1
kafka.topic.hubs=telemetry.hubs.v1

# Custom producer properties
kafka.producer.acks=all
kafka.producer.retries=3
kafka.producer.request-timeout-ms=3000
kafka.producer.delivery-timeout-ms=6000