server:
  port: 0

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
           - classpath:config/telemetry/{application}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # использовать случайный свободный порт
    non-secure-port: ${server.port:0}
    prefer-ip-address: true

# Отключаем защиту от того, что этот сервер не является клиентом (для упрощения)
management:
  endpoints:
    web:
      exposure:
        include: '*'
